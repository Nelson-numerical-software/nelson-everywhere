<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">

  <!-- Top square -->
  <rect x="30" y="6" width="12" height="12" fill="#f4e38a" stroke="#c9b85c" stroke-width="1.5"></rect>

  <!-- Left square -->
  <rect x="6" y="30" width="12" height="12" fill="#f4e38a" stroke="#c9b85c" stroke-width="1.5"></rect>

  <!-- Bottom square -->
  <rect x="30" y="54" width="12" height="12" fill="#f4e38a" stroke="#c9b85c" stroke-width="1.5"></rect>

  <!-- Right circle -->
  <circle cx="60" cy="36" r="6" fill="#f4e38a" stroke="#c9b85c" stroke-width="1.5"></circle>

  <!-- Selection highlight -->
  <rect x="24" y="24" width="24" height="24" fill="none" stroke="#7a73d1" stroke-width="2"></rect>

  <!-- Central button -->
  <circle cx="36" cy="36" r="8" fill="#f0f0f0" stroke="#666" stroke-width="2"></circle>

  <!-- Plus -->
  <line x1="36" y1="31" x2="36" y2="41" stroke="#444" stroke-width="2" stroke-linecap="round"></line>
  <line x1="31" y1="36" x2="41" y2="36" stroke="#444" stroke-width="2" stroke-linecap="round"></line>

</svg>